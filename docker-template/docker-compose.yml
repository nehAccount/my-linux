version: "3.8"

networks:
  docker-network:

services:

  # php 7.4
  app-service:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: bnp-app-image
    container_name: bnp-app-container
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www/bnp-zenica.com
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - docker-network

  # mysql
  mysql-service:
    image: mysql:8
    container_name: bnp-mysql-container
    ports:
      - "4306:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql:rw
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always # always restart unless stopped manually
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: bnp-admin
      MYSQL_PASSWORD: Ngzmhr072
    networks:
      - docker-network

  # nginx
  nginx-service:
    image: nginx:stable-alpine
    container_name: bnp-nginx-container
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/bnp-zenica.com
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-service
      - mysql-service
    networks:
      - docker-network

