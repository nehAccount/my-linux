# ----------------------------------------------------- 
# Autostart
# ----------------------------------------------------- 

# Setup XDG for screen sharing
exec-once = ~/MyHyprland/config/hypr/script/xdg.sh

# Start Polkit (pop up a window asking you for a password whenever an app wants to elevate its privileges)
# gnome type
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# kde type
# exec-once = systemctl --user start plasma-polkit-agent

# WAYBAR
exec-once = waybar

# Load Notification Manager
# exec-once = dunst
exec-once = swaync

# Load GTK settings
exec-once = ~/MyHyprland/config/hypr/script/gtk.sh

# Using hypridle to start hyprlock
# exec-once = hypridle
# exec-once = swayidle -w timeout 600 'swaylock -f' timeout 660 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f'

# Load cliphist history
# exec-once = wl-paste --watch cliphist store

# Initialize Wallpaper Engine
# exec-once = ~/dotfiles/hypr/scripts/init-wallpaper-engine.sh

# Autostart ML4W App
# exec-once = ~/dotfiles/hypr/scripts/ml4w-welcome-autostart.sh

# Load configuration from ML4W Hyprland Settings App
# exec-once = ~/.config/ml4w-hyprland-settings/hyprctl.sh

# Start ewww daemon
# exec-once = ~/dotfiles/hypr/scripts/eww.sh
