<VirtualHost *:80>
    ServerName bnp-zenica.dev
    ServerAlias www.bnp-zenica.dev

    DocumentRoot /var/www/bnp-zenica.com/public
    DirectoryIndex /index.php

    <Directory /var/www/bnp-zenica.com/public>
        AllowOverride All
        Order Allow,Deny
        Allow from All
        Options -Indexes +FollowSymLinks
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/bnp-zenica.com/public/bundles>
        FallbackResource disabled
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php7.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
	
    ErrorLog ${APACHE_LOG_DIR}/bnp-zenica.com-error.log
    CustomLog ${APACHE_LOG_DIR}/bnp-zenica.com-access.log common

RewriteEngine on
RewriteCond %{SERVER_NAME} =bnp-zenica.com [OR]
RewriteCond %{SERVER_NAME} =www.bnp-zenica.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
