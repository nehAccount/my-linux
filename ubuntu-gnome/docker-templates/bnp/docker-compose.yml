version: "3.8"

networks:
  docker-network:

services:

  # php 7.4
  app-service:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        - USER=${USER}
        - UUID=${UUID}
    image: bnp-app-image
    container_name: bnp-app
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www/bnp-zenica.com
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - docker-network
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"

  # mysql
  mysql-service:
    image: mysql:8
    container_name: bnp-mysql
    ports:
      - "4306:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql:rw
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped # always restart unless stopped manually
    environment:
      MYSQL_ROOT_PASSWORD: Ngzmhr072
      MYSQL_USER: bnp-admin
      MYSQL_PASSWORD: Ngzmhr072
      MYSQL_DATABASE: app_bnp
    networks:
      - docker-network

  # nginx
  nginx-service:
    image: nginx:stable-alpine
    container_name: bnp-nginx
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/bnp-zenica.com
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-service
      - mysql-service
    networks:
      - docker-network

  # phpmyadmin
  phpmyadmin-service:
    image: phpmyadmin:latest
    restart: unless-stopped
    container_name: bnp-phpmyadmin
    ports:
      - "8091:80"
    environment:
      PMA_ARBITRARY: 0
      PMA_HOST: mysql-service
      PMA_PORT: 3306
      PMA_USER: bnp-admin
      PMA_PASSWORD: Ngzmhr072
      PMA_PMADB: phpmyadmin
    networks:
      - docker-network
