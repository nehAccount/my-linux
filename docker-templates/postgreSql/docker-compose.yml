version: "3.8"

services:
  postgre-service:
    image: postgres
    container_name: postgres-local
    restart: always
    ports:
      - "54320:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test1234
    volumes:
      - data:/var/lib/postgresql/data:rw
  pgadmin-service:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@docker.dev
      PGADMIN_DEFAULT_PASSWORD: test1234
    volumes:
      - pgadmin:/var/lib/pgadmin:rw

volumes:
  data:
  pgadmin: